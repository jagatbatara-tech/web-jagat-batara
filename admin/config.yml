backend:
  name: github
  repo: jagatbatara-tech/web-jagat-batara
  branch: main
  auth_methods: [token]

media_folder: "images"
public_folder: "/images"

collections:

  # ===== STUDI KASUS / CASE STUDIES =====
  - name: "studi-kasus"
    label: "📚 Studi Kasus (Bahasa Indonesia)"
    folder: "studi-kasus"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Judul", name: "title", widget: "string"}
      - {label: "Kicker (label kecil di atas judul)", name: "kicker", widget: "string", default: "Case Study"}
      - {label: "Tanggal Publish", name: "date", widget: "datetime"}
      - {label: "Ringkasan (paragraf hero)", name: "summary", widget: "text", required: false}
      - label: "Tags / Badge"
        name: "tags"
        widget: "list"
        required: false
        field: {label: "Tag", name: "tag", widget: "string"}
      - label: "Hero Stats (angka highlight, maks 4)"
        name: "hero_stats"
        widget: "list"
        required: false
        fields:
          - {label: "Value", name: "value", widget: "string"}
          - {label: "Label", name: "label", widget: "string"}
      - {label: "Gambar Cover", name: "thumbnail", widget: "image", required: false}
      - {label: "Gambar Arsitektur", name: "architecture_image", widget: "image", required: false}
      - {label: "Caption Gambar Arsitektur", name: "architecture_caption", widget: "string", required: false}
      - {label: "Gambar Dashboard", name: "dashboard_image", widget: "image", required: false}
      - {label: "Caption Gambar Dashboard", name: "dashboard_caption", widget: "string", required: false}
      - label: "Tech Stack"
        name: "tech_stack"
        widget: "list"
        required: false
        field: {label: "Teknologi", name: "tech", widget: "string"}
      - label: "Impact Summary (angka hasil akhir)"
        name: "impact_summary"
        widget: "list"
        required: false
        fields:
          - {label: "Value", name: "value", widget: "string"}
          - {label: "Label", name: "label", widget: "string"}
      - {label: "Disclaimer / Catatan Kerahasiaan", name: "disclaimer", widget: "text", required: false}
      - {label: "Link Versi Inggris", name: "en_link", widget: "string", hint: "contoh: case-studies-en/2024-01-15-example", required: false}
      - {label: "Isi Artikel (Situation/Task/Action/Result)", name: "body", widget: "markdown"}

  - name: "studi-kasus-en"
    label: "📚 Case Studies (English)"
    folder: "studi-kasus-en"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Kicker (small label above title)", name: "kicker", widget: "string", default: "Case Study"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Summary (hero paragraph)", name: "summary", widget: "text", required: false}
      - label: "Tags / Badge"
        name: "tags"
        widget: "list"
        required: false
        field: {label: "Tag", name: "tag", widget: "string"}
      - label: "Hero Stats (numbers highlight, max 4)"
        name: "hero_stats"
        widget: "list"
        required: false
        fields:
          - {label: "Value", name: "value", widget: "string"}
          - {label: "Label", name: "label", widget: "string"}
      - {label: "Cover Image", name: "thumbnail", widget: "image", required: false}
      - {label: "Architecture Image", name: "architecture_image", widget: "image", required: false}
      - {label: "Architecture Image Caption", name: "architecture_caption", widget: "string", required: false}
      - {label: "Dashboard Image", name: "dashboard_image", widget: "image", required: false}
      - {label: "Dashboard Image Caption", name: "dashboard_caption", widget: "string", required: false}
      - label: "Tech Stack"
        name: "tech_stack"
        widget: "list"
        required: false
        field: {label: "Technology", name: "tech", widget: "string"}
      - label: "Impact Summary (final results numbers)"
        name: "impact_summary"
        widget: "list"
        required: false
        fields:
          - {label: "Value", name: "value", widget: "string"}
          - {label: "Label", name: "label", widget: "string"}
      - {label: "Disclaimer / Confidentiality Note", name: "disclaimer", widget: "text", required: false}
      - {label: "Link to Indonesian Version", name: "id_link", widget: "string", hint: "example: studi-kasus/2024-01-15-example", required: false}
      - {label: "Article Content (Situation/Task/Action/Result)", name: "body", widget: "markdown"}

  # ===== SUPPLY CHAIN =====
  - name: "supply-chain"
    label: "🔗 Supply Chain (Bahasa Indonesia)"
    folder: "supply-chain"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
