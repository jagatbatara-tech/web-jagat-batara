# Staticman configuration for the "comments" feature.
# Every comment submitted through the site opens a pull request against this
# repo — nothing goes live until you review and merge it. This is the
# "approval" step requested for comments.
#
# Setup required once (see SETUP.md):
#   1. Install the Staticman GitHub App (or your own self-hosted instance) on
#      this repository.
#   2. Register the repo with the public Staticman API (or point
#      assets/comments.js STATICMAN_ENDPOINT at your own instance).
#   3. Before merging a comment PR, verify the submitted GitHub username is
#      actually watching this repo's Discussions (Watch → Custom →
#      Discussions) — this enforces the "must be subscribed to comment" rule.
#      GitHub does not expose a public subscriber list, so this check is a
#      manual, trust-based step by the site owner (see SETUP.md).
comments:
  allowedFields: ["name", "github", "message"]
  allowedOrigins: ["jagatbatara-tech.github.io"]
  branch: "main"
  commitMessage: "New comment: {fields.name} on {options.slug}"
  filename: "{@timestamp}-{options.slug}"
  format: "yaml"
  moderation: true
  path: "comments/{options.collection}/{options.slug}"
  requiredFields: ["name", "github", "message"]
  generatedFields:
    date:
      type: date
      options:
        format: "iso8601"
