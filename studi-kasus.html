<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studi Kasus | Jagat Batara</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="assets/bilingual.js"></script>
<style> ... same as existing style ... </style>
</head>
<body>
  <div class="container">
    <div id="archive-view">
      <a href="index.html" class="nav-back">&larr; Kembali ke Beranda</a>
      <h1 class="page-title">Arsip Studi Kasus</h1>
      <div id="loading-archive" class="loading">Memuat daftar studi kasus...</div>
      <div id="archive-container"></div>
    </div>
    <div id="single-view" class="hidden">
      <a href="studi-kasus.html" class="nav-back">&larr; Kembali ke Daftar Arsip</a>
      <div id="loading-single" class="loading">Memuat artikel...</div>
      <div id="single-container"></div>
    </div>
  </div>
  <script>
    const REPO = 'jagatbatara-tech/web-jagat-batara';
    const BRANCH = 'main';
    const FOLDER = 'studi-kasus';
    const listUrl = 'https://api.github.com/repos/' + REPO + '/contents/' + FOLDER;
    const { currentLang, translateFrontMatter, translateBody } = window.Bilingual;
    function parsePost(raw) { ... }
    function renderTechPills(items){ ... }
    function renderStatGrid(stats, wrapClass, cardClass){ ... }
    function renderFigure(imgPath, caption){ ... }
    const urlParams = new URLSearchParams(window.location.search);
    const postFile = urlParams.get('post');

    if (postFile) {
      document.getElementById('archive-view').classList.add('hidden');
      document.getElementById('single-view').classList.remove('hidden');

      fetch('https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + FOLDER + '/' + postFile)
        .then(async function(res){ return res.text(); })
        .then(async function(raw){
          document.getElementById('loading-single').style.display = 'none';
          const parsed = parsePost(raw);
          const fm = await translateFrontMatter(parsed.fm);
          const body = await translateBody(parsed.body);
          const bodyHtml = marked.parse(body || '');
          const heroStatsHtml = renderStatGrid(fm.hero_stats, 'stats', 'stat');
          const badgesHtml = (fm.tags && fm.tags.length)
            ? ('<div class="badges">' + fm.tags.map(function(t){ return '<span class="badge">' + t + '</span>'; }).join('') + '</div>') : '';
          const hasRichFields = fm.kicker || fm.summary || (fm.tags && fm.tags.length) || (fm.hero_stats && fm.hero_stats.length);
          const heroHtml = hasRichFields ? (
            '<div class="hero">' +
              (fm.kicker ? ('<div class="kicker">' + fm.kicker + '</div>') : '') +
              '<h1>' + (fm.title || 'Studi Kasus') + '</h1>' +
              (fm.summary ? ('<p class="lead">' + fm.summary + '</p>') : '') +
              badgesHtml + heroStatsHtml + '</div>') : '';
          const archHtml = renderFigure(fm.architecture_image, fm.architecture_caption);
          const dashHtml = renderFigure(fm.dashboard_image, fm.dashboard_caption);
          const techHtml = (fm.tech_stack && fm.tech_stack.length) ? ('<h3>Tools &amp; Techniques</h3>' + renderTechPills(fm.tech_stack)) : '';
          const impactHtml = (fm.impact_summary && fm.impact_summary.length) ? ('<h3>Impact Summary</h3>' + renderStatGrid(fm.impact_summary, 'impact-grid', 'impact-card')) : '';
          const disclaimerHtml = fm.disclaimer ? ('<div class="disclaimer"><strong>Catatan:</strong> ' + fm.disclaimer + '</div>') : '';
          const titleFallback = hasRichFields ? '' : ('<h1>' + (fm.title || 'Studi Kasus') + '</h1>');
          document.getElementById('single-container').innerHTML = heroHtml + '<div class="full-article">' + titleFallback + bodyHtml + archHtml + dashHtml + techHtml + impactHtml + disclaimerHtml + '</div>';
        })
        .catch(function(){ document.getElementById('loading-single').innerText = 'Gagal memuat artikel.'; });
    } else {
      fetch(listUrl)
        .then(function(res){ return res.json(); })
        .then(async function(files){
          document.getElementById('loading-archive').style.display = 'none';
          const container = document.getElementById('archive-container');
          for (const file of [...files.filter(function(f){ return f.name.endsWith('.md'); })].reverse()) {
            const res = await fetch(file.download_url);
            const raw = await res.text();
            const parsed = parsePost(raw);
            const fm = currentLang === 'en' ? await translateFrontMatter(parsed.fm) : parsed.fm;
            const body = currentLang === 'en' ? await translateBody(parsed.body) : parsed.body;
            const title = fm.title || 'Studi Kasus';
            const kicker = fm.kicker || '';
            let excerpt = fm.summary || body.replace(/[#*`_>\[\]]/g, '').trim();
            excerpt = excerpt.length > 200 ? excerpt.substring(0, 200) + '...' : excerpt;
            const card = document.createElement('a');
            card.href = '?post=' + file.name + (currentLang === 'en' ? '&lang=en' : '');
            card.className = 'archive-card';
            card.innerHTML = (kicker ? ('<div class="archive-kicker">' + kicker + '</div>') : '') + '<div class="archive-title">' + title + '</div>' + '<div class="archive-excerpt">' + excerpt + '</div>';
            container.appendChild(card);
          }
        })
        .catch(function(){ document.getElementById('loading-archive').innerText = 'Gagal memuat arsip.'; });
    }
  </script>
</body>
</html>
