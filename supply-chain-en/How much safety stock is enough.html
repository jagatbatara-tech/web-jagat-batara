<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How much safety stock is enough?</title>
<meta name="description" content="Size safety stock with standard formulas, then stress-test it across hundreds of simulated years.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Palette taken from jagatb.com tool pages (PO / Jetty) and index.html */
:root{--bg:#F4F2ED;--ink:#151B1D;--muted:#5B6568;--line:#DDD8CC;--copper:#B77A2B;--gold:#C59B43;--gold-l:#F2D9A0;--dark:#1C2526;
--green:#3E745A;--teal:#2E6E73;--amber:#D49A3A;--red:#B64D42;--card:#FFFFFF;--soft:#EEE9DD;--tsoft:#EAF3F3;
--in-bg:#FFF8E1;--in-ink:#0000CC;--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:Inter,'Segoe UI',Calibri,Arial,sans-serif;
--shadow:0 18px 46px rgba(23,35,36,.13);--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--sans);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);color:var(--dark);line-height:1.2;margin:0}
p{margin:0}
a{color:var(--teal)}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.wrap{max-width:1220px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
.svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lab{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--copper)}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--dark);color:#EDEAE1;border-bottom:6px solid var(--copper)}
.gridfx{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:52px 52px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 40%,rgba(46,110,115,.45),transparent 38%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:48px;padding-top:clamp(64px,9vw,112px);padding-bottom:clamp(56px,8vw,96px);align-items:center}
@media(min-width:1000px){.hero .wrap{grid-template-columns:1.25fr .9fr}}
.hero .lab{color:var(--gold-l)}
.hero h1{color:#fff;font-size:clamp(36px,5.2vw,60px);margin:18px 0 22px;letter-spacing:-.02em}
.hero p.lead{font-size:clamp(17px,1.9vw,19.5px);color:#D6D2C6;max-width:640px}
.meta{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,.18);font-size:14px;color:#BDB8AA}
.meta span{display:flex;align-items:center;gap:8px}
.meta .svg{color:var(--gold-l)}
.meta b{color:#F2D9A0;font-weight:700}
.page-actions,.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.page-action,.btn{display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:11px 20px;border:1px solid var(--copper);border-radius:8px;background:var(--copper);color:#fff;text-decoration:none;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
.page-action:hover,.btn:hover{background:#94601f;border-color:#94601f}
.page-action.secondary,.btn.alt{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.45)}
.page-action.secondary:hover,.btn.alt:hover{background:rgba(255,255,255,.18)}
.page-actions{margin-top:0}
.hero-vis{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px}
.hero-vis svg{display:block;width:100%;height:auto}
.hero-vis .cap{font-size:13px;color:#A9A496;margin-top:12px}
@keyframes draw{to{stroke-dashoffset:0}}
.drawline{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 2.4s var(--ease) .3s forwards}

/* ---------- TOC ---------- */
nav.toc{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav.toc .wrap{display:flex;align-items:center;gap:12px}
.toc-links{display:flex;gap:2px;overflow-x:auto;white-space:nowrap;flex:1;scrollbar-width:none}
.toc-links a{display:block;padding:16px 12px;font-size:14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
.toc-links a:hover{color:var(--dark);border-bottom-color:var(--copper)}
.language{display:flex;align-items:center;gap:4px;padding-left:12px;border-left:1px solid var(--line)}
.language .svg{color:var(--teal);margin-right:2px}
.language button{border:1px solid transparent;background:none;border-radius:7px;padding:5px 9px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.language button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}

/* ---------- Sections ---------- */
section{padding:clamp(64px,8vw,104px) 0;border-bottom:1px solid var(--line)}
section.white{background:#fff}
h2{font-size:clamp(28px,3.4vw,40px);margin:12px 0 16px;letter-spacing:-.015em;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h3{font-size:23px;margin:0 0 10px}
h4{font-size:19px;margin:0 0 8px}
.num{display:inline-grid;place-items:center;background:var(--copper);color:#fff;border-radius:50%;width:42px;height:42px;font-family:var(--serif);font-size:20px;flex:none}
.lead{font-size:clamp(18px,1.8vw,20px);color:var(--muted);max-width:780px}
.prose{max-width:780px;margin-top:20px}
.prose p+p{margin-top:16px}
.grid3,.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:40px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
@media(min-width:1060px){.grid3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--copper);border-radius:12px;padding:28px 28px 30px;box-shadow:0 6px 20px rgba(23,35,36,.05)}
.card p{color:var(--muted);font-size:16px}
.card.teal{border-top-color:var(--teal)}
.ic{width:50px;height:50px;display:grid;place-items:center;border-radius:12px;background:var(--tsoft);color:var(--teal);margin-bottom:18px}
.ic .svg{width:26px;height:26px}
.ic.cu{background:#F6ECDD;color:var(--copper)}
.callout{background:var(--tsoft);border-left:5px solid var(--teal);border-radius:8px;padding:20px 24px;margin-top:32px;max-width:860px}
.note{background:#FFFBF1;border:1px dashed var(--amber);border-radius:8px;padding:16px 20px;margin-top:24px;font-size:15.5px;max-width:860px}
.note b{color:#8A5A12}
.warnbox{background:#FBEDEB;border:1px solid #EBC8C3;border-left:5px solid var(--red);border-radius:8px;padding:14px 20px;font-size:15px}
.diagram{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:40px;overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:680px;height:auto}

/* flow */
.flow{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:40px}
@media(min-width:1000px){.flow{grid-template-columns:repeat(4,1fr)}}
.step{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
.step .k{font-size:13px;font-weight:800;color:var(--copper);letter-spacing:.08em}
.step h4{margin-top:6px}
.step p{color:var(--muted);font-size:16px}
@media(min-width:1000px){.step:not(:last-child):after{content:"";position:absolute;right:-17px;top:52px;width:14px;height:14px;border-top:2px solid var(--copper);border-right:2px solid var(--copper);transform:rotate(45deg);z-index:2}}
ol.daily{margin:20px 0 0;padding-left:24px;max-width:820px}
ol.daily li{margin:10px 0;padding-left:6px}

/* formulas */
.eqs{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:36px;max-width:920px}
.eqb h4{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--muted);margin-bottom:8px}
.eq{font-family:Consolas,"Courier New",monospace;font-size:15px;background:var(--dark);color:#EDEAE1;border-radius:10px;padding:18px 22px;overflow-x:auto;line-height:1.9;white-space:pre}
.eq b{color:#F2D9A0;font-weight:600}
.eq .c{color:#8FB3B5}
.tw{overflow-x:auto;margin-top:32px;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:920px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--dark);color:#fff;text-align:left;padding:12px 16px;font-weight:600;white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:top}
td.k{font-weight:700;white-space:nowrap}

/* ---------- Simulator ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center;margin-top:36px;padding:20px 24px;background:#fff;border:1px solid var(--line);border-radius:14px}
.toolbar .tl{font-size:14px;font-weight:700;color:var(--muted);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--bg)}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:7px;cursor:pointer;font-size:15px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--dark);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--ink)}
.chip .svg{color:var(--copper)}
.chip:hover{border-color:var(--copper);background:#FBF6EE}
.sim{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;margin-top:40px}
@media(min-width:1100px){.sim{grid-template-columns:390px minmax(0,1fr);gap:48px;align-items:start}.inputs{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}}
.inputs{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 28px}
.in-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:12px}
.in-head h3{font-size:22px;margin:0}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--teal);cursor:pointer;font-size:14px;font-weight:700}
.grp{border-top:1px solid var(--line)}
.grp summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;align-items:center;gap:12px;font-weight:700;font-size:16.5px;color:var(--dark)}
.grp summary::-webkit-details-marker{display:none}
.grp summary .gi{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:var(--tsoft);color:var(--teal)}
.grp summary .gi .svg{width:20px;height:20px}
.grp summary .chev{margin-left:auto;color:var(--muted);transition:.2s}
.grp[open] summary .chev{transform:rotate(180deg)}
.fields{display:grid;gap:22px;padding:4px 0 26px}
.fld label{display:block;font-size:15px;font-weight:700;color:var(--dark)}
.fld .h{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.fld input,.fld select{display:block;width:100%;margin-top:10px;padding:11px 13px;border:1px solid #CFC9BB;border-radius:7px;background:var(--in-bg);color:var(--in-ink);font-size:16px}
.fld select{color:var(--ink);background:#fff}
.fld input[aria-invalid="true"]{border-color:var(--red);background:#FBEDEB}
.fld .err{color:var(--red);font-size:13.5px;margin-top:6px}
.runbtn{width:100%;justify-content:center;margin-top:24px;font-size:16px;min-height:52px}
.runbtn:disabled{opacity:.75;cursor:progress}
.mode-basic .adv{display:none !important}
[hidden]{display:none !important}
.results{display:grid;grid-template-columns:minmax(0,1fr);gap:56px;min-width:0;transition:opacity .2s}
.results[aria-busy="true"]{opacity:.55}
.rec{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--dark),#314749);color:#fff;border-radius:18px;padding:clamp(28px,4vw,44px)}
.rec .lab{color:var(--gold-l);display:flex;align-items:center;gap:8px}
.rec .ans{font-family:var(--serif);font-size:clamp(25px,3vw,36px);line-height:1.25;margin-top:16px;color:#fff;max-width:28ch}
.rec .ans b{color:#F2D9A0}
.rec .sub{margin-top:16px;color:#C9CFCC;font-size:15.5px;max-width:62ch}
.rec .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.rec .stats div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 16px;font-size:14px;color:#C9CFCC}
.rec .stats b{display:block;font-family:var(--serif);font-size:22px;color:#fff}
.notes{display:grid;gap:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.kp>div{background:#fff;border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:22px 24px}
.kp>div.bad{border-left-color:var(--red)}
.kp>div.good{border-left-color:var(--green)}
.kp .kl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.kp .kl .svg{color:var(--teal)}
.kp .kv{font-family:var(--serif);font-size:36px;font-weight:700;color:var(--dark);line-height:1.1;margin-top:12px}
.kp .ks{font-size:13.5px;color:var(--muted);margin-top:10px}
.kp .ks.up{color:var(--green);font-weight:700}
.kp .ks.dn{color:var(--red);font-weight:700}
.kp .brk{margin-top:12px;display:grid;gap:4px;font-size:13.5px}
.kp .brk div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.kp .brk span:last-child{color:var(--ink);font-weight:600}
.sh{display:flex;align-items:center;gap:12px;font-size:24px;margin-bottom:8px}
.sh .ic{margin:0;width:42px;height:42px;border-radius:10px}
.sh .ic .svg{width:22px;height:22px}
.narr p{max-width:72ch}
.narr p+p{margin-top:14px}
.chart-h{display:flex;align-items:flex-start;gap:14px}
.chart-h .ic{margin:0;width:42px;height:42px;border-radius:10px;flex:none}
.chart-h .ic .svg{width:22px;height:22px}
.chart-h h3{font-size:22px;margin-top:6px}
.chart .cap{color:var(--muted);font-size:15px;margin-top:10px;max-width:72ch}
.leg{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--muted);margin-top:16px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.leg i.dash{height:0;border-top:2px dashed;border-radius:0;width:18px;vertical-align:4px}
.cbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 12px 8px;margin-top:20px;overflow-x:auto}
.cbox svg{display:block;width:100%;min-width:560px;height:auto;font-family:var(--sans)}
.cbox .gl{stroke:#ECE8DF;stroke-width:1}
.cbox .ax{stroke:#B9B3A6;stroke-width:1}
.cbox .tk{fill:var(--muted);font-size:13.5px}
.cbox .al{fill:var(--muted);font-size:14px;font-weight:600}
.cbox .vl{fill:var(--dark);font-size:14px;font-weight:700}
.btn2{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:1px solid var(--teal);border-radius:8px;background:#fff;color:var(--teal);font-weight:700;font-size:15px;cursor:pointer;margin-top:20px}
.btn2:hover{background:var(--tsoft)}
.livef{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 26px}
.livef summary{cursor:pointer;padding:22px 0;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;color:var(--dark)}
.livef summary .svg{color:var(--teal)}
.livef .eq{margin-bottom:26px;white-space:pre-wrap}
ul.lim{margin:32px 0 0;padding:0;list-style:none;display:grid;gap:14px;max-width:860px}
ul.lim li{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px}
ul.lim .svg{color:var(--red);margin-top:4px}
footer{padding:36px 0 64px;color:var(--muted);font-size:14px}
@media(max-width:640px){body{font-size:16px}.inputs{padding:22px}.kp .kv{font-size:30px}.toolbar{padding:18px}.card{padding:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}.drawline{stroke-dashoffset:0}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h2M16 15v3"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4M12 17h0"/></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-5l-2 2M4 13a8 8 0 0 0 14 5l2-2"/><path d="M4 4v4h4M20 20v-4h-4"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8V4Z"/></symbol>

<script>
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeRng(seed){

function sampleLogn(r,m,s){if(m<=0)return 0;if(s<=0)return m;const v=Math.log(1+(s*s)/(m*m));return Math.exp(Math.log(m)-v/2+Math.sqrt(v)*r.n());}

function Phi(z){const t=1/(1+0.2316419*Math.abs(z));const p=phi(z)*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));return z>0?1-p:p;}

  const b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572];
  const c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=1-pl){q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
function lossG(z){return phi(z)-z*(1-Phi(z));}
function solveG(target){ // find z with G(z)=target (G is decreasing)
  if(target<=lossG(6))return 6;
  let lo=-4,hi=6;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(lossG(m)>target)lo=m;else hi=m;}return(lo+hi)/2;
}
function applyLot(q,p){q=Math.max(q,p.moq||0);const l=p.lotMult>1?p.lotMult:1;return Math.max(l,Math.ceil(q/l-1e-9)*l);}

function demandStats(p){
  const m=p.dMean;let sd=p.dDist==='poisson'?Math.sqrt(m):p.dSd;const out={m};
  if(p.dDist==='intermittent'){
    const q=clamp(p.pOccur/100,0.01,1);const ms=m/q;const minSd=m*Math.sqrt(1/q-1);
    if(sd<minSd){sd=minSd;out.sdRaised=minSd;}
    const vs=Math.max(0,(sd*sd+m*m)/q-ms*ms);out.ms=ms;out.ss=Math.sqrt(vs);

}
function leadStats(p){
  const L=p.ltMean,s=p.ltSd,q1=p.lateProb/100,a=p.lateDays,q2=p.disProb/100,b=p.disDays;
  return {L,s,Lr:L+q1*a+q2*b,sr:Math.sqrt(s*s+q1*(1-q1)*a*a+q2*(1-q2)*b*b)};

function plan(p){
  const d=demandStats(p),lt=leadStats(p);

  const eoq=(H>0&&p.orderCost>0)?Math.sqrt(2*D*p.orderCost/H):d.m*30;
  const qBase=(p.qMode==='manual'&&p.policy!=='RS')?p.qManual:eoq;
  const Q=applyLot(Math.max(1,qBase),p);

function meanAt(p,day){

function sampleDemand(r,p,ds,mu){

function sampleLead(r,p){

/* Simulate runs k0..k1-1. o.ss overrides safety stock. */
function simulate(p,pl,o){

 's1.h':'The question',
 's1.lead':'What buffer keeps this item available at the service level we promised, at the lowest total cost?',
 's1.p1':'Many stocking rules are set once and copied forward: two weeks of cover, a minimum of 100, a number someone trusted years ago. They rarely say which risk they protect against or what they cost. This model turns that rule into an explicit trade-off you can see, test and defend.',
 's1.call':'<b>Three questions this page answers.</b> How much safety stock should we hold, and when should we reorder? Does that buffer really hit the target once demand and lead time behave like the real world? And what does each extra point of service cost?',
 's2.h':'Key concepts in one picture',
 's2.lead':'Stock falls as it is used. An order is placed at the reorder point, and the delivery arrives after the lead time. Safety stock is the floor meant to absorb the surprises in between.',

  for(const g of GROUPS){
    const det=document.createElement('details');det.className='grp'+(g.adv?' adv':'');det.dataset.g=g.id;det.open=openGroups.has(g.id);

    for(const fd of FIELDS.filter(x=>x.g===g.id)){

      else ctrl='<input id="'+lid+'" type="number" inputmode="decimal" step="any" min="'+fd.min+'" max="'+fd.max+'" value="'+state[fd.id]+'" aria-describedby="'+hid+' '+eid+'">';
      w.innerHTML='<label for="'+lid+'">'+t('f.'+fd.id+'.l')+'</label><p class="h" id="'+hid+'">'+t('f.'+fd.id+'.h')+'</p>'+ctrl+'<p class="err" id="'+eid+'" hidden></p>';
      box.appendChild(w);
    }
    det.appendChild(box);f.appendChild(det);
    det.addEventListener('toggle',()=>{if(det.open)openGroups.add(g.id);else openGroups.delete(g.id);});
  }
  f.querySelectorAll('input,select').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',onField));
  updateVisibility();
}
function onField(e){
  const id=e.target.id.slice(2),fd=FIELDS.find(x=>x.id===id);
  if(fd.t==='sel')state[id]=e.target.value;
  else{
    let v=parseFloat(e.target.value);const err=$('e-'+id);
    if(!isFinite(v)||v<fd.min||v>fd.max){e.target.setAttribute('aria-invalid','true');err.textContent=t('err',{min:fn(fd.min,fd.min%1?2:0),max:fn(fd.max,0)});err.hidden=false;return;}
    e.target.removeAttribute('aria-invalid');err.hidden=true;if(fd.int)v=Math.round(v);state[id]=v;
  }
  updateVisibility();changed();
}
function updateVisibility(){for(const fd of FIELDS){if(!fd.show)continue;const w=document.querySelector('[data-f="'+fd.id+'"]');if(w)w.hidden=!fd.show(state);}}
function changed(){sens=null;renderSensState();const p=effective();renderPlan(p,plan(p));clearTimeout(timer);timer=setTimeout(runAll,550);}

/* ---------- Plan ---------- */
function renderPlan(p,pl){
  const b=v=>'<b>'+fu(v)+'</b>';
  $('answer').innerHTML=t('hero.'+p.policy,{ss:b(pl.ss),q:b(pl.Q),rop:b(pl.rop),S:b(pl.S),R:'<b>'+fn(p.reviewR)+'</b>'});
  $('answerSub').textContent=t('hero.sub',{target:fn(p.slTarget,1)+'%',type:t('type.'+p.slType)});
  const st=[['rs.ss',fu(pl.ss)]];
  if(p.policy!=='RS')st.push([p.policy==='minmax'?'l.min':'rs.rop',fu(pl.rop)]);
  if(p.policy==='sQ')st.push(['rs.q',fu(pl.Q)]);else st.push(['rs.S',fu(pl.S)]);
  st.push(['rs.cover',fn(pl.d.m>0?pl.ss/pl.d.m:0,1)]);
  $('recStats').innerHTML=st.map(s=>'<div><b>'+s[1]+'</b>'+t(s[0])+'</div>').join('');
  const notes=[],ds=pl.d;
  if(p.dDist==='intermittent')notes.push(t('w.intermittent'));
  if(ds.sdRaised)notes.push(t('w.sdRaised',{v:fn(ds.sdRaised,2)}));
  if(p.trendPct||p.seasAmp)notes.push(t('w.trend'));
  if(p.capacity>0&&p.capacity<pl.ss+pl.Q)notes.push(t('w.cap',{c:fn(p.capacity),n:fu(pl.ss+pl.Q)}));
  if(p.policy!=='RS'&&Math.abs(pl.Q-Math.max(1,pl.qBase))>0.5&&(p.moq>0||p.lotMult>1))notes.push(t('w.q',{a:fu(pl.qBase),b:fu(pl.Q)}));
  if(pl.zRaw<=0)notes.push(t('w.z0'));
  $('notes').innerHTML=notes.map(n=>'<p class="note" style="margin:0;max-width:none">'+n+'</p>').join('');$('notes').hidden=!notes.length;
  const lt=pl.lt,L=[
    '<span class="c">// '+t('fx.d')+'</span>','d = '+fu(ds.m)+'   σd = '+fu(ds.sd),
    '<span class="c">// '+t('fx.lt')+'</span>','L = '+fu(lt.L)+'   σL = '+fu(lt.s)+'   R = '+fn(pl.R),
    '<span class="c">// '+t('fx.ltr')+'</span>','L′ = '+fu(lt.Lr)+'   σL′ = '+fu(lt.sr),
    '<b>σ_simple</b> = '+fu(pl.sigSimple)+'   <b>σ_combined</b> = '+fu(pl.sigComb)+'   <b>σ_risk</b> = '+fu(pl.sigRisk),
    '<span class="c">// '+(p.slType==='csl'?t('fx.zc'):t('fx.zf'))+'</span>','<b>z</b> = '+fn(pl.z,3),
    '<b>SS</b> = '+fn(pl.z,3)+' × '+fu(pl.sigRisk)+' = '+fu(pl.ss),
    '<b>'+(p.policy==='RS'?'S':'s')+'</b> = '+fu(ds.m)+' × '+fu(lt.Lr+pl.R)+' + '+fu(pl.ss)+' = '+fu(pl.rop),
    '<b>EOQ</b> = √(2 × '+fn(pl.D)+' × '+fn(p.orderCost)+' / '+fn(pl.H,2)+') = '+fu(pl.eoq)+'   →  <b>Q</b> = '+fu(pl.Q)];
  $('liveEq').innerHTML=L.join('\n');
}

/* ---------- Run ---------- */
const tick=()=>new Promise(r=>setTimeout(r,0));
function setBusy(b,pct){$('runBtn').disabled=!!b;$('runTxt').textContent=b?t('running',{pct:Math.round(pct||0)}):t('run');$('results').setAttribute('aria-busy',b?'true':'false');}
async function runAll(){
  clearTimeout(timer);
  const tok=++runToken,p=effective(),pl=plan(p);renderPlan(p,pl);
  const N=p.runs,H=p.horizon,nS=Math.min(N,200),total=N+SWEEP_Z.length*nS;let done=0;
  setBusy(true,0);await tick();
  const runs=[],trace=new Float32Array(N*H),CH=50;
  for(let k=0;k<N;k+=CH){const k1=Math.min(N,k+CH),r=simulate(p,pl,{seed:p.seed,k0:k,k1,keepTrace:true});
    runs.push(...r.runs);trace.set(r.trace,k*H);done+=k1-k;setBusy(true,100*done/total);await tick();if(tok!==runToken)return;}
  const sweep=[];
  for(const z of SWEEP_Z){const ss=z*pl.sigRisk,r=simulate(p,pl,{seed:p.seed,k0:0,k1:nS,ss});
    sweep.push({z,ss,...aggregate(r.runs)});done+=nS;setBusy(true,100*done/total);await tick();if(tok!==runToken)return;}
  last={p,pl,agg:aggregate(runs),runs,trace,N,H,sweep};setBusy(false);renderResults();
}

/* ---------- Results ---------- */
function renderResults(){
  if(!last)return;const {p,pl,agg,sweep}=last;
  const key=p.slType==='csl'?'csl':'fill',tgt=p.slTarget/100;
  const card=(i,l,v,sub,cls)=>'<div class="'+(cls||'')+'"><div class="kl">'+ico(i)+l+'</div><div class="kv">'+v+'</div>'+(sub||'')+'</div>';
  const stat=(v,on)=>{if(!on)return ['',''];const d=(v-tgt)*100;
    if(Math.abs(d)<=1)return ['<p class="ks up">'+t('k.met')+'</p>','good'];
    return d<0?['<p class="ks dn">'+t('k.below',{d:fn(-d,1)})+'</p>','bad']:['<p class="ks up">'+t('k.above',{d:fn(d,1)})+'</p>','good'];};
  const s1=stat(agg.csl,key==='csl'),s2=stat(agg.fill,key==='fill');let h='';
  h+=card('i-target',t('k.csl'),fp(agg.csl),(key==='csl'?'<p class="ks">'+t('k.target',{t:fp(tgt)})+'</p>':'')+s1[0],s1[1]);
  h+=card('i-box',t('k.fill'),fp(agg.fill),(key==='fill'?'<p class="ks">'+t('k.target',{t:fp(tgt)})+'</p>':'')+s2[0],s2[1]);
  h+=card('i-alert',t('k.so'),fn(agg.soDays,1),'<p class="ks">'+t('k.noSo',{p:fp(agg.noSo,0)})+'</p>',agg.soDays>5?'bad':'');
  h+=card('i-warehouse',t('k.oh'),fu(agg.avgOH),'<p class="ks">'+t('k.value',{v:fn(agg.avgOH*p.unitCost)})+'</p>');
  h+=card('i-refresh',t('k.turns'),fn(agg.turns,1),'<p class="ks">'+t('k.perYear')+'</p>');
  const br=[['c.hold',agg.hold],['c.ord',agg.ord],['c.so',agg.so]];if(p.shelfLife>0)br.push(['c.ex',agg.ex]);
  h+=card('i-coins',t('k.cost'),fn(agg.total),'<div class="brk">'+br.map(b=>'<div><span>'+t(b[0])+'</span><span>'+fn(b[1])+'</span></div>').join('')+'</div>');
  if(p.shelfLife>0)h+=card('i-clock',t('k.exp'),fu(agg.expUnits));
  $('kpis').innerHTML=h;
  const imp=interpAt(sweep,key,tgt,'ss'),achieved=agg[key],n=[];
  n.push(t('n.1',{csl:fp(agg.csl),fill:fp(agg.fill),target:fp(tgt),type:t('type.'+p.slType)}));
  if(achieved<tgt-0.01)n.push(imp==null?t('n.belowNull',{max:fu(sweep[sweep.length-1].ss)}):t('n.below',{imp:fu(imp),ss:fu(pl.ss)}));
  else if(achieved>tgt+0.01&&imp!=null)n.push(t('n.above',{imp:fu(imp),ss:fu(pl.ss)}));
  else n.push(t('n.met'));
  if(pl.sigRisk>0)n.push(t('n.lt',{share:fp(pl.ltShare,0)}));
  const hiT=Math.min(0.99,sweep[sweep.length-1][key]);
  if(tgt<hiT-0.005){const c0=interpAt(sweep,key,tgt,'total'),c1=interpAt(sweep,key,hiT,'total');
    if(c0!=null&&c1!=null&&Math.abs(c1-c0)>0.01*c0)n.push(t(c1>c0?'n.cost':'n.costSave',{a:fp(tgt),b:fp(hiT),c:fn(Math.abs(c1-c0))}));}
  $('narr').innerHTML=n.map(x=>'<p>'+x+'</p>').join('');
  last.imp=imp;last.hiT=hiT;drawCharts();
}

const C={ink:'#1C2526',teal:'#2E6E73',copper:'#B77A2B',gold:'#C59B43',red:'#B64D42',green:'#3E745A',muted:'#5B6568',grey:'#9AA3A6',band:'rgba(46,110,115,.18)'};
function nice(min,max,n){const span=(max-min)||1,s0=span/(n||5),mag=Math.pow(10,Math.floor(Math.log10(s0)));
  const st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=s0-1e-12);const a=Math.floor(min/st)*st,b=Math.ceil(max/st)*st;const tk=[];
  for(let v=a;v<=b+st*1e-6;v+=st)tk.push(+v.toFixed(10));return {tk,min:a,max:b};}
function frame(o){
  const W=o.w||760,H=o.h||400,P=Object.assign({l:84,r:24,t:24,b:60},o.pad||{});
  const sx=v=>P.l+(v-o.x0)/((o.x1-o.x0)||1)*(W-P.l-P.r),sy=v=>H-P.b-(v-o.y0)/((o.y1-o.y0)||1)*(H-P.t-P.b);
  let g='';
  for(const v of o.yt||[]){const yy=sy(v);g+='<line class="gl" x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+yy+'" y2="'+yy+'"/><text class="tk" x="'+(P.l-10)+'" y="'+(yy+4)+'" text-anchor="end">'+o.yf(v)+'</text>';}
  for(const v of o.xt||[]){const xx=sx(v);g+='<text class="tk" x="'+xx+'" y="'+(H-P.b+22)+'" text-anchor="middle">'+o.xf(v)+'</text>';}
  g+='<line class="ax" x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+(H-P.b)+'" y2="'+(H-P.b)+'"/>';
  if(o.xl)g+='<text class="al" x="'+((P.l+W-P.r)/2)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(o.xl)+'</text>';
  if(o.yl)g+='<text class="al" transform="translate(16 '+((P.t+H-P.b)/2)+') rotate(-90)" text-anchor="middle">'+esc(o.yl)+'</text>';
  return {sx,sy,g,W,H,P};
}
const svg=(f,body,label)=>'<svg viewBox="0 0 '+f.W+' '+f.H+'" role="img" aria-label="'+esc(label||'')+'">'+f.g+body+'</svg>';
const leg=items=>items.map(i=>'<span><i class="'+(i.dash?'dash':'')+'" style="'+(i.dash?'border-color:':'background:')+i.c+'"></i>'+esc(i.l)+'</span>').join('');

function drawCharts(){
  if(!last)return;const {p,pl,trace,N,H,runs,sweep,agg}=last;const key=p.slType==='csl'?'csl':'fill';
  // 1 sawtooth
  const lo=new Float64Array(H),hi=new Float64Array(H),col=new Float64Array(N);let below=0,mx=0;
  for(let d=0;d<H;d++){for(let k=0;k<N;k++){const v=trace[k*H+d];col[k]=v;if(v<pl.ss)below++;}
    col.sort();lo[d]=col[Math.floor(.1*(N-1))];hi[d]=col[Math.floor(.9*(N-1))];if(hi[d]>mx)mx=hi[d];if(trace[d]>mx)mx=trace[d];}
  mx=Math.max(mx,pl.rop);$('t1').textContent=t('t1',{p:fp(below/(N*H),0)});
  const yn=nice(0,mx*1.05,5),xn=nice(1,H,6);
  const f1=frame({x0:1,x1:H,y0:0,y1:yn.max,yt:yn.tk,xt:xn.tk.filter(v=>v>=1&&v<=H),yf:v=>fn(v),xf:v=>fn(v),xl:t('ax.day'),yl:t('ax.units'),pad:{r:112}});
  let band='M';for(let d=0;d<H;d++)band+=(d?'L':'')+f1.sx(d+1).toFixed(1)+' '+f1.sy(hi[d]).toFixed(1);
  for(let d=H-1;d>=0;d--)band+='L'+f1.sx(d+1).toFixed(1)+' '+f1.sy(lo[d]).toFixed(1);band+='Z';
  let line='M'+f1.sx(1).toFixed(1)+' '+f1.sy(trace[0]).toFixed(1);
  for(let d=1;d<H;d++){line+='H'+f1.sx(d+1).toFixed(1)+'V'+f1.sy(trace[d]).toFixed(1);}
  const hl=(v,c,lab,dash)=>'<line x1="'+f1.P.l+'" x2="'+(f1.W-f1.P.r)+'" y1="'+f1.sy(v)+'" y2="'+f1.sy(v)+'" stroke="'+c+'" stroke-width="1.8" stroke-dasharray="'+dash+'"/><text x="'+(f1.W-f1.P.r+8)+'" y="'+(f1.sy(v)+4)+'" fill="'+c+'" font-size="13" font-weight="700">'+esc(lab)+'</text>';
  let b1='<path d="'+band+'" fill="'+C.band+'"/><path d="'+line+'" fill="none" stroke="'+C.ink+'" stroke-width="1.5"/>'+hl(pl.ss,C.copper,t('l.ss'),'7 5');
  const l1=[{c:C.ink,l:t('l.sample')},{c:C.band,l:t('l.band')},{c:C.copper,l:t('l.ss'),dash:1}];
  if(p.policy!=='RS'){const lab=p.policy==='minmax'?t('l.min'):t('l.rop');b1+=hl(pl.rop,C.teal,lab,'3 4');l1.push({c:C.teal,l:lab,dash:1});}
  $('c1').innerHTML=svg(f1,b1,t('t1',{p:''}));$('leg1').innerHTML=leg(l1);
  // 2 histogram
  const so=runs.map(r=>r.soDays),smx=Math.max(...so);let bins,lab;
  if(smx<=12){const m=Math.ceil(smx);bins=new Array(m+1).fill(0);so.forEach(v=>bins[Math.round(v)]++);lab=bins.map((_,i)=>fn(i));}
  else{const nb=9,w=Math.ceil(smx/nb);bins=new Array(nb+1).fill(0);so.forEach(v=>{const r=Math.round(v);bins[r===0?0:Math.min(nb,1+Math.floor((r-1)/w))]++;});
    lab=bins.map((_,i)=>i===0?fn(0):(w===1?fn(i):fn((i-1)*w+1)+'–'+fn(i*w)));}
  $('t2').textContent=t('t2',{p:fp(agg.noSo,0)});
  const bmx=Math.max(...bins),yn2=nice(0,bmx*1.12,4),nb=bins.length;
  const f2=frame({x0:0,x1:nb,y0:0,y1:yn2.max,yt:yn2.tk,xt:[],yf:v=>fn(v),xf:v=>'',xl:t('ax.soDays'),yl:t('ax.runs')});
  const bw=(f2.sx(1)-f2.sx(0)),gap=Math.min(14,bw*.2);let b2='';
  bins.forEach((v,i)=>{const x=f2.sx(i)+gap/2,w=bw-gap,yy=f2.sy(v),hh=f2.sy(0)-yy;
    b2+='<rect x="'+x+'" y="'+yy+'" width="'+w+'" height="'+Math.max(0,hh)+'" rx="3" fill="'+(i===0?C.green:C.red)+'"><title>'+lab[i]+': '+fn(v)+'</title></rect>';
    if(v>0)b2+='<text class="vl" x="'+(x+w/2)+'" y="'+(yy-8)+'" text-anchor="middle">'+fn(v)+'</text>';
    b2+='<text class="tk" x="'+(x+w/2)+'" y="'+(f2.H-f2.P.b+22)+'" text-anchor="middle">'+lab[i]+'</text>';});
  $('c2').innerHTML=svg(f2,b2,$('t2').textContent);
  // 3 tradeoff
  const pts=sweep.map(s=>({x:s[key]*100,y:s.total})),cur={x:agg[key]*100,y:agg.total};
  const xs=pts.map(q=>q.x).concat(cur.x,p.slTarget),ys=pts.map(q=>q.y).concat(cur.y);
  const xn3=nice(Math.min(...xs)-1,100,6),yn3=nice(0,Math.max(...ys)*1.08,5);
  const f3=frame({x0:xn3.min,x1:Math.min(100,xn3.max),y0:0,y1:yn3.max,yt:yn3.tk,xt:xn3.tk.filter(v=>v<=100),yf:v=>fn(v),xf:v=>fn(v)+'%',xl:t('ax.service'),yl:t('ax.cost')});
  const c0=interpAt(sweep,key,p.slTarget/100,'total'),c1=interpAt(sweep,key,last.hiT,'total');
  const ok3=c0!=null&&c1!=null&&p.slTarget/100<last.hiT-0.005&&Math.abs(c1-c0)>0.01*c0;
  $('t3').textContent=ok3?t(c1>c0?'t3':'t3s',{a:fp(p.slTarget/100),b:fp(last.hiT),c:fn(Math.abs(c1-c0))}):t('t3b');
  let b3='<line x1="'+f3.sx(p.slTarget)+'" x2="'+f3.sx(p.slTarget)+'" y1="'+f3.P.t+'" y2="'+(f3.H-f3.P.b)+'" stroke="'+C.grey+'" stroke-dasharray="4 4"/>'+
    '<text x="'+(f3.sx(p.slTarget)-6)+'" y="'+(f3.P.t+14)+'" text-anchor="end" class="tk">'+esc(t('k.target',{t:fn(p.slTarget,1)+'%'}))+'</text>';
  b3+='<polyline fill="none" stroke="'+C.muted+'" stroke-width="1.8" points="'+pts.map(q=>f3.sx(q.x).toFixed(1)+','+f3.sy(q.y).toFixed(1)).join(' ')+'"/>';
  pts.forEach((q,i)=>{b3+='<circle cx="'+f3.sx(q.x)+'" cy="'+f3.sy(q.y)+'" r="5" fill="#fff" stroke="'+C.muted+'" stroke-width="2"><title>SS '+fu(sweep[i].ss)+': '+fn(q.x,1)+'% → '+fn(q.y)+'</title></circle>';});
  b3+='<circle cx="'+f3.sx(cur.x)+'" cy="'+f3.sy(cur.y)+'" r="11" fill="'+C.copper+'" stroke="#fff" stroke-width="3"/>'+
    '<text x="'+(f3.sx(cur.x)-14)+'" y="'+(f3.sy(cur.y)-30)+'" text-anchor="end" fill="'+C.copper+'" font-size="14" font-weight="700">'+esc(t('l.current'))+'</text>';
  $('c3').innerHTML=svg(f3,b3,$('t3').textContent);
  // 4 comparison (horizontal)
  const z=pl.z,vals=[pl.sigSimple*z,pl.sigComb*z,pl.ss,last.imp],labs=[t('b.simple'),t('b.comb'),t('b.risk'),t('b.sim')],cols=[C.grey,C.grey,C.teal,C.copper];
  const ref=last.imp!=null?last.imp:pl.ss;
  if(ref<=0.5)$('t4').textContent=t('t4z');else{const df=vals[0]/ref-1;$('t4').textContent=t(df<0?'t4u':'t4o',{x:fp(Math.abs(df),0)});}
  const vmx=Math.max(1,...vals.filter(v=>v!=null)),xn4=nice(0,vmx*1.15,5);
  const f4=frame({h:320,x0:0,x1:xn4.max,y0:0,y1:4,yt:[],xt:xn4.tk,yf:()=>'',xf:v=>fn(v),xl:t('ax.ss'),pad:{l:160,r:40,b:56}});
  let b4='';xn4.tk.forEach(v=>{b4+='<line class="gl" x1="'+f4.sx(v)+'" x2="'+f4.sx(v)+'" y1="'+f4.P.t+'" y2="'+(f4.H-f4.P.b)+'"/>';});
  const rh=(f4.H-f4.P.t-f4.P.b)/4;
  vals.forEach((v,i)=>{const yy=f4.P.t+i*rh+rh*.2,hh=rh*.6;
    b4+='<text x="'+(f4.P.l-14)+'" y="'+(yy+hh/2+5)+'" text-anchor="end" fill="'+C.ink+'" font-size="14" font-weight="600">'+esc(labs[i])+'</text>';
    if(v==null){b4+='<text class="tk" x="'+(f4.P.l+8)+'" y="'+(yy+hh/2+5)+'">–</text>';return;}
    b4+='<rect x="'+f4.P.l+'" y="'+yy+'" width="'+Math.max(0,f4.sx(v)-f4.P.l)+'" height="'+hh+'" rx="3" fill="'+cols[i]+'"/>'+
      '<text class="vl" x="'+(f4.sx(v)+8)+'" y="'+(yy+hh/2+5)+'">'+fu(v)+'</text>';});
  $('c4').innerHTML=svg(f4,b4,$('t4').textContent);
  drawSens();
}
function renderSensState(){
  $('sensBtn').disabled=false;$('sensTxt').textContent=t('sensRun');
  if(!sens){$('c5').hidden=true;$('leg5').hidden=true;$('t5').textContent=t('t5n');}
}
async function runSens(){
  if(!last)return;$('sensBtn').disabled=true;$('sensTxt').textContent=t('sensBusy');await tick();
  const base=effective(),tok=runToken,keys=['dMean','dSd','ltMean','ltSd','unitCost','holdPct','orderCost','stockoutCost'].filter(k=>!(k==='dSd'&&base.dDist==='poisson'));
  const nR=Math.min(base.runs,150),run=pp=>aggregate(simulate(pp,plan(pp),{seed:pp.seed,k0:0,k1:nR}).runs).total;
  const c0=run(base),rows=[];
  for(const k of keys){const lo={...base,[k]:base[k]*0.8},hi={...base,[k]:base[k]*1.2};if(k==='ltMean')lo.ltMean=Math.max(1,lo.ltMean);
    rows.push({k,lo:run(lo)-c0,hi:run(hi)-c0});await tick();if(tok!==runToken){renderSensState();return;}}
  rows.sort((a,b)=>Math.max(Math.abs(b.lo),Math.abs(b.hi))-Math.max(Math.abs(a.lo),Math.abs(a.hi)));
  sens={rows};$('sensBtn').disabled=false;$('sensTxt').textContent=t('sensRun');drawSens();
}
function drawSens(){
  if(!sens)return;const r=sens.rows;$('c5').hidden=false;$('leg5').hidden=false;
  $('t5').textContent=t('t5',{param:t('sh.'+r[0].k)});
  const m=Math.max(1,...r.map(x=>Math.max(Math.abs(x.lo),Math.abs(x.hi)))),xn=nice(-m*1.15,m*1.15,6);
  const f=frame({h:80+r.length*52,x0:xn.min,x1:xn.max,y0:0,y1:1,yt:[],xt:xn.tk,yf:()=>'',xf:v=>(v>0?'+':'')+fn(v),xl:t('ax.delta'),pad:{l:170,r:30,t:16}});
  let b='';xn.tk.forEach(v=>{b+='<line class="gl" x1="'+f.sx(v)+'" x2="'+f.sx(v)+'" y1="'+f.P.t+'" y2="'+(f.H-f.P.b)+'"/>';});
  b+='<line x1="'+f.sx(0)+'" x2="'+f.sx(0)+'" y1="'+f.P.t+'" y2="'+(f.H-f.P.b)+'" stroke="'+C.ink+'" stroke-width="1.5"/>';
  const rh=(f.H-f.P.t-f.P.b)/r.length;
  r.forEach((x,i)=>{const y0=f.P.t+i*rh+rh*.18,hh=rh*.3;
    b+='<text x="'+(f.P.l-14)+'" y="'+(y0+hh+4)+'" text-anchor="end" fill="'+C.ink+'" font-size="14" font-weight="600">'+esc(t('sh.'+x.k))+'</text>';
    [[x.lo,C.grey,0],[x.hi,C.teal,1]].forEach(([v,c,j])=>{const a=f.sx(Math.min(0,v)),w=Math.abs(f.sx(v)-f.sx(0)),yy=y0+j*(hh+3);
      b+='<rect x="'+a+'" y="'+yy+'" width="'+w+'" height="'+hh+'" rx="2" fill="'+c+'"><title>'+fn(v)+'</title></rect>';});});
  $('c5').innerHTML=svg(f,b,$('t5').textContent);
  $('leg5').innerHTML=leg([{c:C.grey,l:t('l.down')},{c:C.teal,l:t('l.up')}]);
}

/* ---------- Export ---------- */
function exportCsv(){
  if(!last)return;const {p,agg,pl}=last;const rows=[['section','key','value']];
  for(const k in p)rows.push(['input',k,p[k]]);
  [['safety_stock',pl.ss],['reorder_level',pl.rop],['order_quantity',pl.Q],['order_up_to',pl.S],['z',pl.z],['sigma_risk_adjusted',pl.sigRisk],['sim_implied_ss',last.imp]].forEach(r=>rows.push(['plan',r[0],r[1]]));
  for(const k in agg)rows.push(['result',k,agg[k]]);
  const csv=rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='safety-stock-results.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ---------- Wiring ---------- */
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;store.set('sss-lang',lang);if(urlLang){try{const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);}catch(e){}}renderStatic();buildForm();const p=effective();renderPlan(p,plan(p));renderResults();}));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{if(mode===b.dataset.mode)return;mode=b.dataset.mode;store.set('sss-mode',mode);
  document.body.className=mode==='adv'?'mode-adv':'mode-basic';document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===mode));changed();}));
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
  const pr=PRESETS[b.dataset.preset];state={...DEFAULTS,...pr.v,seed:state.seed};
  if(pr.adv&&mode!=='adv'){mode='adv';store.set('sss-mode',mode);document.body.className='mode-adv';document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===mode));}
  buildForm();changed();}));
$('resetBtn').addEventListener('click',()=>{state={...DEFAULTS};buildForm();changed();});
$('runBtn').addEventListener('click',runAll);
$('sensBtn').addEventListener('click',runSens);
$('exportBtn').addEventListener('click',exportCsv);
$('form').addEventListener('submit',e=>{e.preventDefault();runAll();});

renderStatic();buildForm();runAll();
})();}
